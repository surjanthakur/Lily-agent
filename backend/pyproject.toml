[project]
name = "backend"
version = "0.1.0"
description = "lily a research good reads multi agent project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "pathlib>=1.0.1",
    "pydantic>=2.12.5,<2.13.0",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.42",
    "tavily-python>=0.8.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

